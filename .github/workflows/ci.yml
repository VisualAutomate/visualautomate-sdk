name: CI

# Every push and pull request: typecheck, build, test. Publishing to npm is done
# by hand with `npm run release`; see the README.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, build & test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows too: the CLI runs on developers' own machines, and path
        # handling is where it breaks first.
        os: [ubuntu-latest, windows-latest]
        # 20 because the platform sandbox runs Node 20: plugin code runs in the
        # same process as the CLI, so the CLI has to work where the code will.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
